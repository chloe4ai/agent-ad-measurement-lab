name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest && python -m pytest -q
      - name: Regenerate results and check they match the committed files
        run: |
          python -m lab.run && python -m lab.real score --out docs/real_results.json && python scripts/build_dashboard.py
          git diff --exit-code -- docs/results.json docs/real_results.json docs/index.html || {
            echo "::error::docs/results.json or docs/index.html is out of date. Run python -m lab.run && python scripts/build_dashboard.py and commit the result."
            exit 1
          }
