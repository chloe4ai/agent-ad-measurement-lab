name: CI
# Same checks as the deploy workflow, on pull requests, without deploying.
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && python -m pytest -q
      - name: Regenerate results and check they match the committed files
        run: |
          python -m lab.run && python scripts/build_dashboard.py
          git diff --exit-code -- docs/results.json docs/index.html || {
            echo "::error::docs/results.json or docs/index.html is out of date. Run python -m lab.run && python scripts/build_dashboard.py and commit the result."
            exit 1
          }
